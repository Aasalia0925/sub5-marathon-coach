name: 서브5 코치 알림

on:
  # 실행은 cron-job.org가 정각에 workflow_dispatch로 보냄 (아침 준비도 매일, 주간 리포트 일요일 20:00 KST)
  # GitHub 자체 예약(schedule)은 몇 시간씩 늦어서 쓰지 않음
  workflow_dispatch:
    inputs:
      mode:
        description: "보낼 알림"
        required: true
        default: morning
        type: choice
        options: [morning, weekly]

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 알림 보내기
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then MODE="$INPUT_MODE"
          elif [ "$EVENT_SCHEDULE" = "0 11 * * 0" ]; then MODE=weekly
          else MODE=morning; fi
          python3 coach.py "$MODE"
